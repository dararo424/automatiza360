<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b10" />
    <meta name="description" content="Automatiza360 — Tu negocio atendido 24/7 desde WhatsApp. Pedidos, citas, inventario y clientes en piloto automático." />
    <title>Automatiza360 · Tu negocio en piloto automático</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Desregistra Service Workers obsoletos para evitar cache stale
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
